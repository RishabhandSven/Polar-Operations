<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="100" fill="#0f172a"/>
  <!-- Compass / Polar Grid -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="12"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#334155" stroke-width="8"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="#2563eb" stroke-width="6"/>
  <!-- Crosshairs -->
  <line x1="256" y1="40" x2="256" y2="472" stroke="#3b82f6" stroke-width="6" stroke-dasharray="16 8"/>
  <line x1="40" y1="256" x2="472" y2="256" stroke="#3b82f6" stroke-width="6" stroke-dasharray="16 8"/>
  <!-- North Indicator Needle -->
  <polygon points="256,90 286,256 256,230 226,256" fill="#38bdf8"/>
  <!-- South Needle -->
  <polygon points="256,422 286,256 256,282 226,256" fill="#94a3b8"/>
  <circle cx="256" cy="256" r="16" fill="#f8fafc"/>
</svg>
