services:
  postgres:
    image: postgres:16-alpine
    container_name: polarops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-polarops}
      POSTGRES_USER: ${POSTGRES_USER:-polarops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polarops_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-polarops} -d ${POSTGRES_DB:-polarops}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: polarops-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-polarops}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-polarops}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-polarops_dev}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: polarops-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
