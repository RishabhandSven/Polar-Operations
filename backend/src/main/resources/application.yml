server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: polarops-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/polarops}
    username: ${SPRING_DATASOURCE_USERNAME:polarops}
    password: ${SPRING_DATASOURCE_PASSWORD:polarops_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
